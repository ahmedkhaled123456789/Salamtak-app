name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, tests, Android bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependencies match the Expo SDK
        run: npx expo install --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # proves the JS bundle + assets build for Android (no native toolchain needed)
      - run: npx expo export --platform android --output-dir dist-android
        env: { EXPO_PUBLIC_API_BASE_URL: https://api.example.ae }
